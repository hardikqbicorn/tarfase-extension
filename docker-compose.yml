name: universal-ide-event-collector

services:
  # ---------------------------------------------------------------------------
  # Kafka (KRaft mode - no ZooKeeper)
  # ---------------------------------------------------------------------------
  kafka:
    image: bitnami/kafka:3.7
    container_name: ide-collector-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092,INTERNAL://kafka:29092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      # Single-broker dev cluster: replication must be 1 or topic creation fails.
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    volumes:
      - kafka-data:/bitnami/kafka

  # Creates the platform's topics with the right partition counts and retention,
  # then exits. Everything else waits on it so no service races topic creation.
  kafka-init:
    image: bitnami/kafka:3.7
    container_name: ide-collector-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infrastructure/kafka/create-topics.sh:/scripts/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP: "kafka:29092"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ide-collector-kafka-ui
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: "ide-collector"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
      DYNAMIC_CONFIG_ENABLED: "true"

  # ---------------------------------------------------------------------------
  # Postgres (Supabase-compatible: the same schema applies to a real Supabase
  # project; only the connection string changes)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ide-collector-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ide_events
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ide_events"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Migrations run in filename order on first boot.
      - ./database/supabase/migrations:/docker-entrypoint-initdb.d:ro

  # ---------------------------------------------------------------------------
  # Platform services
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: api
    container_name: ide-collector-api
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "8081"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ide_events
      # Dev-only defaults. Override via a .env file (see .env.example) or real
      # secrets management before deploying anywhere real.
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key}
      ALLOW_OPEN_ENROLLMENT: ${ALLOW_OPEN_ENROLLMENT:-true}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8081/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  ingestion:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: ingestion
    container_name: ide-collector-ingestion
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC_RAW: ide.events.raw
      KAFKA_TOPIC_ERRORS: ide.events.errors
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  consumer:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: consumer
    container_name: ide-collector-consumer
    ports:
      - "8082:8082"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "8082"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: ide-events-persister
      KAFKA_TOPIC_RAW: ide.events.raw
      KAFKA_TOPIC_ERRORS: ide.events.errors
      KAFKA_TOPIC_PROCESSED: ide.events.processed
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ide_events
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8082/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kafka-data:
  postgres-data:
